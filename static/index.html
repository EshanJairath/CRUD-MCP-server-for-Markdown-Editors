<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .status-text {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .tool-card:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }

        .tool-card h3 {
            color: #38bdf8;
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-card .description {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #22c55e;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .result-box.visible {
            display: block;
        }

        .result-box.error {
            color: #ef4444;
            border-color: #ef4444;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff40;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: #334155;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .badge.required {
            background: #7c3aed33;
            color: #a78bfa;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: #475569;
            font-size: 0.8rem;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 MCP Server Web Interface</h1>
            <p>Interact with your Model Context Protocol tools directly from your browser</p>
        </header>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Connecting to MCP server...</span>
        </div>

        <div class="tools-grid" id="toolsGrid">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                <p>Loading tools...</p>
            </div>
        </div>

        <footer>
            MCP Server Web Interface &mdash; Built with FastAPI
        </footer>
    </div>

    <script>
        const toolsGrid = document.getElementById('toolsGrid');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        async function loadTools() {
            try {
                const response = await fetch('/api/tools');
                if (!response.ok) throw new Error('Failed to fetch tools');
                
                const tools = await response.json();
                
                if (tools.length === 0) {
                    toolsGrid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <p>No tools available. Make sure your MCP server is running.</p>
                        </div>`;
                    setStatus(false, 'No tools found');
                    return;
                }

                setStatus(true, `${tools.length} tools loaded`);
                toolsGrid.innerHTML = tools.map(tool => createToolCard(tool)).join('');
            } catch (error) {
                toolsGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <p>Failed to connect to MCP server: ${error.message}</p>
                    </div>`;
                setStatus(false, 'Connection failed');
            }
        }

        function setStatus(connected, message) {
            statusDot.className = 'status-dot' + (connected ? ' connected' : '');
            statusText.textContent = message;
        }

        function createToolCard(tool) {
            const properties = tool.inputSchema.properties || {};
            const required = tool.inputSchema.required || [];
            
            let formFields = '';
            Object.keys(properties).forEach(key => {
                const prop = properties[key];
                const isRequired = required.includes(key);
                const type = prop.type || 'string';
                
                let inputElement = '';
                if (type === 'boolean') {
                    inputElement = `
                        <select id="arg_${key}" class="form-control">
                            <option value="true">true</option>
                            <option value="false" selected>false</option>
                        </select>`;
                } else {
                    const isTextarea = prop.description && prop.description.length > 50;
                    inputElement = isTextarea 
                        ? `<textarea id="arg_${key}" placeholder="${prop.description || key}"></textarea>`
                        : `<input type="text" id="arg_${key}" placeholder="${prop.description || key}" ${isRequired ? 'required' : ''}>`;
                }
                
                formFields += `
                    <div class="form-group">
                        <label>${key} ${isRequired ? '<span class="badge required">required</span>' : ''}</label>
                        ${inputElement}
                    </div>`;
            });

            return `
                <div class="tool-card">
                    <h3>
                        <span>⚡</span> ${tool.name}
                        <span class="badge">${Object.keys(properties).length} params</span>
                    </h3>
                    <p class="description">${tool.description}</p>
                    ${formFields}
                    <button class="btn btn-primary" onclick="executeTool('${tool.name}', ${JSON.stringify(tool.inputSchema)})">
                        Execute
                    </button>
                    <div class="result-box" id="result_${tool.name}"></div>
                </div>`;
        }

        async function executeTool(toolName, inputSchema) {
            const resultBox = document.getElementById(`result_${toolName}`);
            const btn = event.target;
            
            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Executing...';
            resultBox.className = 'result-box';
            resultBox.textContent = '';

            // Build arguments from form fields
            const properties = inputSchema.properties || {};
            const arguments = {};
            
            try {
                for (const key of Object.keys(properties)) {
                    const el = document.getElementById(`arg_${key}`);
                    if (!el) continue;
                    
                    const prop = properties[key];
                    let value = el.value.trim();
                    
                    // Handle boolean type
                    if (prop.type === 'boolean') {
                        arguments[key] = el.value === 'true';
                    } else if (value) {
                        arguments[key] = value;
                    }
                }

                // Call the API
                const response = await fetch('/api/call_tool', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tool_name: toolName,
                        arguments: arguments
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultBox.textContent = data.result;
                    resultBox.className = 'result-box visible';
                } else {
                    resultBox.textContent = `Error: ${data.detail || 'Unknown error'}`;
                    resultBox.className = 'result-box visible error';
                }
            } catch (error) {
                resultBox.textContent = `Network error: ${error.message}`;
                resultBox.className = 'result-box visible error';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Execute';
            }
        }

        // Load tools on page load
        loadTools();
    </script>
</body>
</html>
